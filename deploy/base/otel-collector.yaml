# OpenTelemetry Collector: every service sends spans HERE, never to Jaeger
# directly.
#
#   gateway ─┐
#   payments ┼─ OTLP/HTTP :4318 ─► collector ─ OTLP/gRPC :4317 ─► jaeger
#   psp-sim ─┘
#
# Why a middle hop at all, on a laptop where it costs memory?
#   - The services only know "send OTLP to the collector". Swapping Jaeger for
#     Tempo, or adding a second backend, is a collector config change and no
#     service is rebuilt or redeployed.
#   - The collector batches, retries and applies a memory limit in ONE place,
#     instead of every service doing it slightly differently.
#   - Later (Build phase) the same collector receives metrics for Prometheus.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: ledgerline
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      # Must run FIRST. If Jaeger is slow or down, spans queue up in the
      # collector; this refuses new data before the pod hits its memory limit
      # and is OOM-killed. Dropping some spans is better than losing the
      # collector, because losing the collector loses ALL spans.
      memory_limiter:
        check_interval: 1s
        limit_mib: 80
        spike_limit_mib: 20
      batch:
        timeout: 2s

    exporters:
      otlp/jaeger:
        endpoint: jaeger.ledgerline:4317
        tls:
          insecure: true   # in-cluster traffic, lab only

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: ledgerline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        # Restart the pod when the config above changes, instead of silently
        # running the old config until someone notices.
        ledgerline/config-version: "1"
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector:0.165.0
        args: ["--config=/etc/otelcol/config.yaml"]
        ports:
          - { name: otlp-http, containerPort: 4318 }
          - { name: otlp-grpc, containerPort: 4317 }
        volumeMounts:
          - { name: config, mountPath: /etc/otelcol }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: otel-collector }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ledgerline
spec:
  selector:
    app: otel-collector
  ports:
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
