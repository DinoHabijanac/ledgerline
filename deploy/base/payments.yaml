apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: ledgerline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
      - name: payments
        image: ko://github.com/DinoHabijanac/ledgerline/services/payments
        ports:
          - containerPort: 8080
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef: { name: pg-app, key: uri }
        readinessProbe:
          httpGet: { path: /readyz, port: 8080 }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 8080 }
          periodSeconds: 10
        resources:
          requests: { cpu: 50m, memory: 32Mi }
          limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: ledgerline
spec:
  selector:
    app: payments
  ports:
    - port: 80
      targetPort: 8080