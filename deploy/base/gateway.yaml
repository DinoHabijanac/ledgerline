apiVersion: v1
kind: Namespace
metadata:
  name: ledgerline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ledgerline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: ko://github.com/DinoHabijanac/ledgerline/services/gateway
        ports:
          - containerPort: 8080
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 8080 }
          periodSeconds: 10
        resources:
          requests: { cpu: 50m, memory: 32Mi }
          limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ledgerline
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8080