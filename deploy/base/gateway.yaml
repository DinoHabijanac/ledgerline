apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ledgerline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: ko://github.com/DinoHabijanac/ledgerline/services/gateway
        ports:
          - containerPort: 8080
        env:
          - name: PAYMENTS_URL
            value: http://payments.ledgerline
          # Must stay LARGER than payments' 2s timeout to psp-sim, so that
          # payments gets to decide and report the outcome instead of being
          # cut off by its own caller. See the comment on withTimeout.
          - name: PAYMENTS_TIMEOUT_MS
            value: "3000"
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 8080 }
          periodSeconds: 10
        resources:
          requests: { cpu: 50m, memory: 32Mi }
          limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ledgerline
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8080